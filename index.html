
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My QR Website</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    .box img {
      width: 250px;
      max-width: 80vw;
      border-radius: 10px;
    }

    h1 {
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Scan / Click QR</h1>

    <a href="https://example.com" target="_blank">
      <img src="qr-code.png" alt="QR Code">
    </a>

  </div>

</body>
</html>
